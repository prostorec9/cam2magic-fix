name: Build Fixed Cam2Magic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode APK with Apktool
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool d base.apk -o decoded_apk

      - name: Patch Camera3.smali to preserve position in TikTok battles
        run: |
          python3 - << 'EOF'
          path = "decoded_apk/smali/com/nothing/camera2magic/hook/Camera3.smali"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Добавляем статическое поле savedPositionMs
          field_target = ".field private static thread:Landroid/os/HandlerThread;"
          field_replacement = field_target + "\n\n.field public static savedPositionMs:J"
          assert field_target in content, "Field target not found"
          content = content.replace(field_target, field_replacement, 1)

          # 2. Сохраняем текущую позицию в handleLocalVideo$lambda$9 перед очисткой плейлиста (если плеер уже играл)
          # и подставляем savedPositionMs вместо C.TIME_UNSET (-0x7fffffffffffffffL) при инициализации нового окна
          old_block_1 = """    invoke-virtual {v1, v5}, Lm30;->j(Lt21;)I

    .line 98
    .line 99
    .line 100
    invoke-virtual {v1}, Lm30;->g()J"""

          new_block_1 = """    invoke-virtual {v1, v5}, Lm30;->j(Lt21;)I

    invoke-virtual {v1}, Lm30;->g()J
    move-result-wide v6
    const-wide/16 v13, 0x0
    cmp-long v8, v6, v13
    if-lez v8, :cond_skip_save_pos1
    sput-wide v6, Lcom/nothing/camera2magic/hook/Camera3;->savedPositionMs:J
    :cond_skip_save_pos1"""

          assert old_block_1 in content, "old_block_1 not found"
          content = content.replace(old_block_1, new_block_1, 1)

          # 3. В handleLocalVideo$lambda$9 заменяем старт с нуля (-0x7fffffffffffffffL) на старт с savedPositionMs
          old_block_2 = """    invoke-virtual {v2, v4}, Lk31;->a(Z)I

    .line 211
    .line 212
    .line 213
    move-result v14

    .line 214
    iget-object v0, v1, Lm30;->Y:Lt21;

    .line 215
    .line 216
    const-wide v6, -0x7fffffffffffffffL    # -4.9E-324"""

          new_block_2 = """    invoke-virtual {v2, v4}, Lk31;->a(Z)I

    move-result v14

    iget-object v0, v1, Lm30;->Y:Lt21;

    sget-wide v6, Lcom/nothing/camera2magic/hook/Camera3;->savedPositionMs:J
    const-wide/16 v15, 0x0
    cmp-long v8, v6, v15
    if-gtz v8, :cond_use_saved_pos
    const-wide v6, -0x7fffffffffffffffL    # -4.9E-324
    :cond_use_saved_pos"""

          assert old_block_2 in content, "old_block_2 not found"
          content = content.replace(old_block_2, new_block_2, 1)

          # 4. В stop$lambda$17 сохраняем текущую позицию плеера перед тем, как сессия камеры закроется в баттле
          old_block_3 = """    iget-object v3, v2, Lm30;->Y:Lt21;

    .line 82
    .line 83
    invoke-virtual {v2, v3}, Lm30;->j(Lt21;)I"""

          new_block_3 = """    invoke-virtual {v2}, Lm30;->g()J
    move-result-wide v5
    const-wide/16 v7, 0x0
    cmp-long v7, v5, v7
    if-lez v7, :cond_skip_save_stop
    sput-wide v5, Lcom/nothing/camera2magic/hook/Camera3;->savedPositionMs:J
    :cond_skip_save_stop
    iget-object v3, v2, Lm30;->Y:Lt21;

    invoke-virtual {v2, v3}, Lm30;->j(Lt21;)I"""

          assert old_block_3 in content, "old_block_3 not found"
          content = content.replace(old_block_3, new_block_3, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Successfully patched Camera3.smali!")
          EOF

      - name: Rebuild and Sign APK
        run: |
          apktool b decoded_apk -o patched-unaligned.apk
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)"
          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 patched-unaligned.apk Cam2Magic-BattleFixed.apk
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS_DIR/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android Cam2Magic-BattleFixed.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Cam2Magic-BattleFixed-APK
          path: Cam2Magic-BattleFixed.apk
