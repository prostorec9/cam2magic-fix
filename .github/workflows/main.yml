name: Build Fixed Cam2Magic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode DEX only with Apktool
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool d -r base.apk -o decoded_apk

      - name: Patch Camera3.smali safely without register conflicts
        run: |
          python3 - << 'EOF'
          path = "decoded_apk/smali/com/nothing/camera2magic/hook/Camera3.smali"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Добавляем статическое поле savedPositionMs
          field_target = ".field private static thread:Landroid/os/HandlerThread;"
          field_replacement = field_target + "\n\n.field public static savedPositionMs:J"
          assert field_target in content, "Field target not found"
          content = content.replace(field_target, field_replacement, 1)

          # 2. Добавляем изолированный метод сохранения позиции в конец файла (без конфликта регистров)
          helper_method = (
              "\n.method public static savePosIfValid(Lm30;)V\n"
              "    .locals 4\n\n"
              "    if-eqz p0, :cond_end\n\n"
              "    invoke-virtual {p0}, Lm30;->g()J\n\n"
              "    move-result-wide v0\n\n"
              "    const-wide/16 v2, 0x0\n\n"
              "    cmp-long v2, v0, v2\n\n"
              "    if-lez v2, :cond_end\n\n"
              "    sput-wide v0, Lcom/nothing/camera2magic/hook/Camera3;->savedPositionMs:J\n\n"
              "    :cond_end\n"
              "    return-void\n"
              ".end method\n"
          )
          content = content + helper_method

          # 3. Вызываем savePosIfValid перед перезагрузкой плейлиста в handleLocalVideo$lambda$9
          old_block_1 = (
              "    invoke-virtual {v1, v5}, Lm30;->j(Lt21;)I\n\n"
              "    .line 98\n"
              "    .line 99\n"
              "    .line 100\n"
              "    invoke-virtual {v1}, Lm30;->g()J"
          )
          new_block_1 = (
              "    invoke-virtual {v1, v5}, Lm30;->j(Lt21;)I\n\n"
              "    invoke-static {v1}, Lcom/nothing/camera2magic/hook/Camera3;->savePosIfValid(Lm30;)V\n\n"
              "    .line 98\n"
              "    .line 99\n"
              "    .line 100\n"
              "    invoke-virtual {v1}, Lm30;->g()J"
          )
          assert old_block_1 in content, "old_block_1 not found"
          content = content.replace(old_block_1, new_block_1, 1)

          # 4. Подставляем сохраненную позицию вместо C.TIME_UNSET (-0x7fffffffffffffffL)
          old_block_2 = (
              "    invoke-virtual {v2, v4}, Lk31;->a(Z)I\n\n"
              "    .line 211\n"
              "    .line 212\n"
              "    .line 213\n"
              "    move-result v14\n\n"
              "    .line 214\n"
              "    iget-object v0, v1, Lm30;->Y:Lt21;\n\n"
              "    .line 215\n"
              "    .line 216\n"
              "    const-wide v6, -0x7fffffffffffffffL    # -4.9E-324"
          )
          new_block_2 = (
              "    invoke-virtual {v2, v4}, Lk31;->a(Z)I\n\n"
              "    .line 211\n"
              "    .line 212\n"
              "    .line 213\n"
              "    move-result v14\n\n"
              "    .line 214\n"
              "    iget-object v0, v1, Lm30;->Y:Lt21;\n\n"
              "    .line 215\n"
              "    .line 216\n"
              "    sget-wide v6, Lcom/nothing/camera2magic/hook/Camera3;->savedPositionMs:J"
          )
          assert old_block_2 in content, "old_block_2 not found"
          content = content.replace(old_block_2, new_block_2, 1)

          # 5. Вызываем savePosIfValid в stop$lambda$17 перед закрытием сессии камеры в баттле
          old_block_3 = (
              "    iget-object v3, v2, Lm30;->Y:Lt21;\n\n"
              "    .line 82\n"
              "    .line 83\n"
              "    invoke-virtual {v2, v3}, Lm30;->j(Lt21;)I"
          )
          new_block_3 = (
              "    invoke-static {v2}, Lcom/nothing/camera2magic/hook/Camera3;->savePosIfValid(Lm30;)V\n\n"
              "    iget-object v3, v2, Lm30;->Y:Lt21;\n\n"
              "    .line 82\n"
              "    .line 83\n"
              "    invoke-virtual {v2, v3}, Lm30;->j(Lt21;)I"
          )
          assert old_block_3 in content, "old_block_3 not found"
          content = content.replace(old_block_3, new_block_3, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Successfully patched Camera3.smali!")
          EOF

      - name: Inject patched DEX into original APK and Sign
        run: |
          apktool b decoded_apk -o temp_built.apk
          cp base.apk patched-unaligned.apk
          zip -d patched-unaligned.apk "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/*.EC" "META-INF/MANIFEST.MF" || true
          cd decoded_apk/build/apk && zip -0 -r ../../../patched-unaligned.apk classes*.dex && cd ../../..

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)"
          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 patched-unaligned.apk Cam2Magic-BattleFixed.apk
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS_DIR/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true Cam2Magic-BattleFixed.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Cam2Magic-BattleFixed-APK
          path: Cam2Magic-BattleFixed.apk
